<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Online Radio</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Arial', sans-serif;
    }

    body {
      background-color: #121212;
      color: #f5f5f5;
      padding: 20px;
    }

    header {
      background-color: #1a1a1a;
      color: white;
      padding: 20px;
      text-align: center;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    header h1 {
      flex: 1;
      font-size: 24px;
    }

    .header-buttons {
      display: flex;
      gap: 10px;
    }

    .header-buttons a {
      text-decoration: none;
      color: white;
      background-color: #333;
      padding: 10px 20px;
      border-radius: 5px;
      transition: background-color 0.3s;
    }

    .header-buttons a:hover {
      background-color: #555;
    }

    .container {
      display: flex;
      gap: 20px;
      margin-top: 20px;
      width: 100%;
      max-width: 100%;
      flex-wrap: wrap;
    }

    .block {
      flex: 1;
      background-color: #1c1c1c;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.5);
    }

    .block h2 {
      margin-bottom: 20px;
      text-align: center;
    }

    ul {
      list-style: none;
      padding: 0;
      margin: 0;
    }

    ul li {
      background-color: #2c2c2c;
      margin: 10px 0;
      padding: 10px;
      border-radius: 5px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    ul li button {
      background-color: #28a745;
      color: white;
      border: none;
      padding: 5px;
      border-radius: 5px;
      cursor: pointer;
      font-size: 14px;
      width: 150px;
      transition: background-color 0.3s;
    }

    ul li button:hover {
      background-color: #218838;
    }

    .audio-player {
      text-align: center;
    }

    .audio-player select,
    .audio-player input {
      margin: 10px 0;
      padding: 5px;
      border-radius: 5px;
      border: 1px solid #444;
      background-color: #2c2c2c;
      color: #ddd;
    }

    .audio-player button {
      background-color: #007BFF;
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 5px;
      cursor: pointer;
    }
    .playlist-actions {
      display: inline-flex;
      gap: 5px;
      margin-left: auto;
    }

    .btn-icon {
      background-color: #28a745;
      border: none;
      border-radius: 4px;
      color: white;
      cursor: pointer;
      width: 24px;
      height: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
    }

    .btn-icon:hover {
      background-color: #218838;
    }

    .icon-sequential {
      font-size: 14px;
    }

    .icon-shuffled {
      font-size: 14px;
    }

    li {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 5px;
      list-style: none;
      border-bottom: 1px solid #ccc;
    }

    .audio-player button:hover {
      background-color: #0056b3;
    }

    .search-controls {
      display: flex;
      gap: 10px;
      margin-bottom: 10px;
    }

    .search-controls input {
      flex: 1;
      padding: 5px;
      border-radius: 5px;
      border: 1px solid #444;
      background-color: #2c2c2c;
      color: #ddd;
    }

    .search-controls button {
      background-color: #007BFF;
      color: white;
      border: none;
      padding: 5px 10px;
      border-radius: 5px;
      cursor: pointer;
    }


    .search-controls {
      display: flex;
      gap: 10px;
      margin-bottom: 10px;
    }

    .search-controls input {
      flex: 1;
      padding: 5px;
      border-radius: 5px;
      border: 1px solid #444;
      background-color: #2c2c2c;
      color: #ddd;
    }

    .search-controls button {
      background-color: #007BFF;
      color: white;
      border: none;
      padding: 5px;
      border-radius: 5px;
      cursor: pointer;
      width: 24px;
      height: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .search-controls button:hover {
      background-color: #0056b3;
    }

    .search-controls button::before {
      content: '🔍';
      font-size: 16px;
    }
  </style>
</head>
<body>
<header>
  <h1>Online Radio</h1>
  <div class="header-buttons">
    <a href="/admin/userStats">Users Stat</a>
    <a href="/admin/userPanel">Edit Users</a>
    <a href="/admin/songPanel">Edit Songs</a>
    <a href="/admin/artistPanel">Edit Artists</a>
    <a href="/admin/playlistPanel">Edit Playlists</a>
    <a href="/login">Login</a>
  </div>
</header>
<div class="container">
  <div class="block">
    <h2>Current Queue</h2>
    <ul id="queueList"></ul>
    <button onclick="playNext()">Play Next Song</button>
    <button onclick="clearQueue()">Clear Queue</button>
  </div>

  <div class="block">
    <h2>Playlists</h2>
    <div class="search-controls">
      <input type="text" id="playlistSearchField" placeholder="Search playlists...">
      <button onclick="searchPlaylists()"></button>
    </div>
    <ul id="playlistList"></ul>
  </div>

  <div class="block">
    <h2>Songs</h2>
    <div class="search-controls">
      <input type="text" id="songSearchField" placeholder="Search songs...">
      <button onclick="searchSongs()"></button>
    </div>
    <ul id="songList"></ul>
  </div>

  <div class="block">
    <h2>Audio Player</h2>
    <section class="audio-player">
      <label for="bitrate">Choose bitrate:</label>
      <select id="bitrate" onchange="updateBitrate(this.value)">
        <option value="64">64 kbps</option>
        <option value="92">92 kbps</option>
        <option value="128" selected>128 kbps</option>
        <option value="196">196 kbps</option>
        <option value="224">224 kbps</option>
      </select>
      <br><br>
      <button id="playPauseButton" onclick="togglePlayPause()">Play Song</button>
      <p id="songTitle"></p>
      <p id="songArtists"></p>
      <label for="volumeSlider">Volume:</label>
      <input type="range" id="volumeSlider" min="0" max="1" step="0.01" value="1" onchange="setVolume(this.value)">
      <audio id="audioPlayer" autoplay>
        <source type="audio/mp3">
        Your browser does not support the audio element.
      </audio>
      <section class="user-info">
        <p id="userCount">Users connected: 0</p>
      </section>
      <section class="song-history">
        <h2>Song History</h2>
        <ul id="songHistoryList">

        </ul>
      </section>
    </section>
  </div>
</div>
<script src="script.js"></script>
<script src="admin.js"></script>
</body>
</html>
