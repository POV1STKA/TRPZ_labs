<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>User Statistics</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
  body {
  font-family: 'Arial', sans-serif;
  background-color: #121212;
  color: #f5f5f5;
  padding: 20px;
  margin: 0;
  }

  .header {
  text-align: center;
  margin-bottom: 20px;
  background-color: #1a1a1a;
  color: white;
  padding: 20px 0;
  }

  h1 {
  text-align: center;
  margin-bottom: 20px;
  color: #f5f5f5;
  }

  .header-content {
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 0 20px;
  }

  .container {
  max-width: 1200px;
  margin: 20px auto;
  background-color: #1c1c1c;
  border-radius: 8px;
  padding: 20px;
  box-shadow: 0 4px 10px rgba(0, 0, 0, 0.5);
  display: flex;
  flex-wrap: nowrap;
  justify-content: space-between;
  align-items: flex-start;
  }


  .table-container {
  margin-top: 20px;
  background-color: #1a1a1a;
  border-radius: 8px;
  padding: 20px;
  box-shadow: 0 4px 10px rgba(0, 0, 0, 0.5);
  overflow-x: auto;
  width: 48%;

  }


  .chart-container {
  margin-top: 20px;
  background-color: #1a1a1a;
  border-radius: 8px;
  padding: 20px;
  box-shadow: 0 4px 10px rgba(0, 0, 0, 0.5);
  width: 48%;
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 350px;
  }



  .chart-container canvas {
  max-width: 450px;
  max-height: 350px;
  width: auto;
  height: auto;
  }

  .table-container table {
  width: 100%;
  border-collapse: collapse;
  margin-top: 10px;
  border: 1px solid #444;
  }

  .table-container th, .table-container td {
  border: 1px solid #444;
  padding: 8px;
  text-align: center;
  }

  .table-container th {
  background-color: #333;
  }

  .table-container tbody tr:nth-child(even) {
  background-color: #2c2c2c;
  }

  .table-container tbody tr:hover {
  background-color: #333;
  }


  </style>
</head>
<body>
<div class="header">
  <div class="header-content">
    <h2 href="/">Online Radio</h2>
  </div>
</div>
<div class="container">
  <div class="table-container">
    <h2>Connection History</h2>
    <table id="userHistoryTable">
      <thead>
      <tr>
        <th>Time</th>
        <th>Users</th>
      </tr>
      </thead>
      <tbody id="userHistoryBody">

      </tbody>
    </table>
  </div>
  <h1>-</h1>
  <div class="chart-container">
    <canvas id="userChart"></canvas>
  </div>
</div>

<script>
    document.addEventListener('DOMContentLoaded', function() {
        fetch('history', {
            method: 'GET',
            headers: {
                'Content-Type': 'application/json',
            },
        })
            .then(response => {
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                return response.json();
            })
            .then(historyData => {
                populateTable(historyData);
                createChart(historyData);
            })
            .catch(error => {
                console.error('Error fetching user history:', error);
            });
    });

    function populateTable(historyData) {
        const tableBody = document.getElementById('userHistoryBody');

        for (const timestamp in historyData) {
            const row = document.createElement('tr');
            const timeCell = document.createElement('td');
            const usersCell = document.createElement('td');
            timeCell.textContent = timestamp;
            usersCell.textContent = historyData[timestamp];
            row.appendChild(timeCell);
            row.appendChild(usersCell);
            tableBody.appendChild(row);
        }
    }

    function createChart(historyData) {
        const labels = Object.keys(historyData);
        const data = Object.values(historyData);
        const ctx = document.getElementById('userChart').getContext('2d');

        new Chart(ctx, {
            type: 'line',
            data: {
                labels: labels,
                datasets: [{
                    label: 'Connected Users',
                    data: data,
                    borderColor: 'rgb(75, 192, 192)',
                    borderWidth: 2,
                    fill: false
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                scales: {
                    x: {
                         title: {
                            display: true,
                            text: 'Time'
                         }
                    },
                    y: {
                        title: {
                            display: true,
                            text: 'Number of Users'
                       },
                      beginAtZero: true
                    }
                }
            }
        });
    }
</script>
</body>
</html>
