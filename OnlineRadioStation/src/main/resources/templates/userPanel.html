<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Management</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        table {
            width: 100%;
            border-collapse: collapse;
        }
        th, td {
            border: 1px solid #ddd;
            padding: 8px;
            text-align: left;
        }
        th {
            background-color: #f4f4f4;
        }
        button {
            margin: 5px;
            padding: 5px 10px;
            cursor: pointer;
        }
        select, input[type="text"] {
            width: 100%;
        }
    </style>
</head>
<body>
<h1>User Management</h1>
<div>
    <button onclick="createNewUserRow()">Create New</button>
    <input type="text" id="searchInput" placeholder="Search by login">
    <button onclick="searchUsers()">Search</button>
</div>
<table id="userTable">
    <thead>
    <tr>
        <th>ID</th>
        <th>Login</th>
        <th>Password</th>
        <th>Role</th>
        <th>Actions</th>
    </tr>
    </thead>
    <tbody>

    </tbody>
</table>
<script>
        const API_URL = 'users';


        async function fetchAllUsers() {
            const response = await fetch(`${API_URL}/all`);
            const users = await response.json();
            populateTable(users);
        }

        async function searchUsers() {
            const login = document.getElementById('searchInput').value;
            const url = login ? `${API_URL}?login=${encodeURIComponent(login)}` : `${API_URL}/all`;
            const response = await fetch(url);
            const users = await response.json();
            populateTable(users);
        }

        function populateTable(users) {
            const tableBody = document.getElementById('userTable').querySelector('tbody');
            tableBody.innerHTML = '';
            users.forEach(user => addUserRow(user));
        }

        function addUserRow(user) {
            const tableBody = document.getElementById('userTable').querySelector('tbody');
            const row = document.createElement('tr');
            row.innerHTML = `
                <td>${user.id}</td>
                <td contenteditable="true">${user.login}</td>
                <td contenteditable="true">${user.password}</td>
                <td>
                    <select>
                        <option value="USER" ${user.role === 'USER' ? 'selected' : ''}>USER</option>
                        <option value="ADMIN" ${user.role === 'ADMIN' ? 'selected' : ''}>ADMIN</option>
                    </select>
                </td>
                <td>
                    <button onclick="updateUser(this, ${user.id})">Save</button>
                    <button onclick="deleteUser(${user.id})">Delete</button>
                </td>
            `;
            tableBody.appendChild(row);
        }

        function createNewUserRow() {
            const tableBody = document.getElementById('userTable').querySelector('tbody');
            const row = document.createElement('tr');
            row.innerHTML = `
                <td>New</td>
                <td contenteditable="true"></td>
                <td contenteditable="true"></td>
                <td>
                    <select>
                        <option value="USER">USER</option>
                        <option value="ADMIN">ADMIN</option>
                    </select>
                </td>
                <td>
                    <button onclick="saveNewUser(this)">Save</button>
                    <button onclick="this.closest('tr').remove()">Cancel</button>
                </td>
            `;
            tableBody.appendChild(row);
        }

        async function saveNewUser(button) {
            const row = button.closest('tr');
            const login = row.children[1].innerText.trim();
            const password = row.children[2].innerText.trim();
            const role = row.children[3].querySelector('select').value;

            if (!login || !password) {
                alert('Login and password are required.');
                return;
            }

            const userData = { login, password, role };
            const response = await fetch(API_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(userData),
            });

            if (response.ok) {
                fetchAllUsers();
            } else {
                alert('Failed to create user.');
            }
        }

        async function updateUser(button, id) {
            const row = button.closest('tr');
            const login = row.children[1].innerText.trim();
            const password = row.children[2].innerText.trim();
            const role = row.children[3].querySelector('select').value;

            if (!login || !password) {
                alert('Login and password are required.');
                return;
            }

            const userData = { id, login, password, role };
            const response = await fetch(API_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(userData),
            });

            if (response.ok) {
                fetchAllUsers();
            } else {
                alert('Failed to update user.');
            }
        }

        async function deleteUser(id) {
            if (confirm('Are you sure you want to delete this user?')) {
                const response = await fetch(`${API_URL}/${id}`, { method: 'DELETE' });
                if (response.ok) {
                    fetchAllUsers();
                } else {
                    alert('Failed to delete user.');
                }
            }
        }

        fetchAllUsers();
    </script>
</body>
</html>
